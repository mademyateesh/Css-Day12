<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .student{
    border: 2px solid rgb(8, 4, 253);
    padding: 20px;
    text-align: center;
    height: 430px;
    width: 350px;
    border-radius: 60px;
    box-shadow: 
            10px 10px 35px rgb(35, 14, 221),
            -10px -10px 40px rgb(210, 30, 87);

    margin-top: 150px;
    margin-left: 550px;
}

#profile{
    color: rgb(20, 182, 90);
    text-decoration: underline rgb(255, 0, 0);
    letter-spacing: 2px;
    font-variant: small-caps;
    font-weight: 900;
    text-shadow: 5px 5px 5px greenyellow;
}
.content{
    font-family: cursive;
    word-spacing: 6%;
}

#skills{
    letter-spacing: 6px;
}
.skills{
    word-spacing: 10px;
    text-align: center;
    font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
}

    </style>
</head>

<body>
    <div class="student">
        <img src="./d-illustration-smiling-student-icon-using-laptop-headphones-sitting-pile-books-studying-learning-isolated-350268136.webp" alt="Student Profile" height="150" width="150px">
        <h1 id="profile">Madem Yateesh</h1>
        <p class="content">Dream big, Learn continuously,<br>
            and build a better tomorrow.</p>
        <hr>
        <h3 id="skills">Skills:</h3>
        <div class="skills">
            <span>Java   .</span>
            <span>SQL     .</span>
            <span>Web Development</span>
        </div>
    </div>
</body>

</html>
